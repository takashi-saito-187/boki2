<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://api.github.com https://gist.githubusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2716%27 height=%2732%27 fill=%27%231B6FC4%27/%3E%3Crect x=%2716%27 width=%2716%27 height=%2732%27 fill=%27%23B5560A%27/%3E%3C/svg%3E">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>簿記2級 最短ルート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* レイアウト：スマホ1カラムが基準。上に固定ヘッダー、スマホは下タブ・PCはヘッダー内タブ。
   色は「借方＝青・貸方＝橙」を全画面で固定し、5つの箱もホームポジションの色で塗る。 */
:root{
  --bg:#F2F6FB; --surface:#FFFFFF; --surface2:#E8EEF7; --ink:#15213A; --muted:#55647F; --line:#D5DEEB;
  --dr:#1B6FC4; --dr-bg:#E2EEFB; --cr:#B5560A; --cr-bg:#FCEBD9;
  --sun:#FFC933; --sun-ink:#33270A; --sun-bg:#FFF4CC;
  --ok:#11845B; --ok-bg:#DBF4E8; --ng:#C7323F; --ng-bg:#FBE2E4;
  --on-solid:#FFFFFF;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --body:"Hiragino Sans","Yu Gothic UI","Meiryo UI","Meiryo","Noto Sans JP",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#172238; --surface2:#1F2D48; --ink:#E9EFF9; --muted:#A3B1C9; --line:#2D3D5C;
  --dr:#7FB8F6; --dr-bg:#17304F; --cr:#F4A862; --cr-bg:#3D2A16;
  --sun:#FFD257; --sun-ink:#2B2105; --sun-bg:#3A3212;
  --ok:#5FD3A4; --ok-bg:#143629; --ng:#F58A93; --ng-bg:#43191D;
  --on-solid:#0E1524; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#172238; --surface2:#1F2D48; --ink:#E9EFF9; --muted:#A3B1C9; --line:#2D3D5C;
  --dr:#7FB8F6; --dr-bg:#17304F; --cr:#F4A862; --cr-bg:#3D2A16;
  --sun:#FFD257; --sun-ink:#2B2105; --sun-bg:#3A3212;
  --ok:#5FD3A4; --ok-bg:#143629; --ng:#F58A93; --ng-bg:#43191D;
  --on-solid:#0E1524; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4,.disp{font-family:var(--display);line-height:1.35;text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--dr)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:12px;min-height:54px}
.brand{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:inline-grid;grid-template-columns:1fr 1fr;width:22px;height:22px;border-radius:6px;overflow:hidden;font-style:normal}
.brand i::before,.brand i::after{content:""}.brand i::before{background:var(--dr)}.brand i::after{background:var(--cr)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tabs button[aria-current="page"]{background:var(--sun);color:var(--sun-ink)}
.tabs .badge{background:var(--ng);color:var(--on-solid);border-radius:999px;font-size:11px;padding:0 6px;line-height:18px;font-family:var(--body)}
@media (max-width:719px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs button{flex:1;justify-content:center;flex-direction:column;gap:0;font-size:12px;padding:4px 2px;position:relative}
  .tabs button .ic{font-size:19px;line-height:1.2}
  .tabs .badge{position:absolute;top:0;right:calc(50% - 26px)}
  main{padding-bottom:84px}
}
@media (min-width:720px){ .tabs{margin-left:16px} .sync{order:3} }

main{padding-block:20px 48px}
.wrap{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-t{font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-t small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-family:var(--display);font-weight:700;font-size:15px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ホーム */
.hero{background:var(--ink);color:var(--bg);border-radius:18px;padding:20px;display:grid;gap:14px;grid-template-columns:1fr auto;align-items:end}
.hero .cd{font-family:var(--display);font-weight:900;font-size:44px;line-height:1}
.hero .cd small{font-size:16px;font-weight:700;margin-left:4px}
.hero .lbl{font-size:13px;opacity:.8}
.hero .stats{display:flex;gap:18px;text-align:right}
.hero .stats b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.hero .stats span{font-size:11px;opacity:.8}
.hero .goal{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.hero input[type=date]{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:8px;padding:4px 8px;color:var(--bg);color-scheme:dark}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hero input[type=date]{color-scheme:light} }
:root[data-theme="dark"] .hero input[type=date]{color-scheme:light}
.menu{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.todo{display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.todo h3{font-size:15px}
.todo .big{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.1}
.stage{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.stage:first-of-type{border-top:0}
.stage .em{font-size:24px;grid-row:span 2}
.stage h3{font-size:15px}
.stage .when{font-size:12px;color:var(--muted);white-space:nowrap}
.bar{grid-column:2/-1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.pill{font-size:11px;border-radius:99px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-family:var(--body);font-weight:400}
.pill.open{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.rank{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;font-family:var(--display);font-weight:900;font-size:12px}
.rank.A{background:var(--sun);color:var(--sun-ink)} .rank.B{background:var(--surface2);color:var(--ink)}

/* 学ぶ */
.lrow{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lrow .no{font-family:var(--display);font-weight:900;color:var(--muted);font-size:13px}
.lrow .ti{font-family:var(--display);font-weight:700;min-width:0}
.lrow .st{font-size:12px;color:var(--muted);white-space:nowrap}
.lrow .bar{grid-column:2/-1;height:5px}
.lrow.done .no{color:var(--ok)}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.trow .q{font-size:12px;color:var(--muted);white-space:nowrap}
.trow>div{min-width:0}

/* レッスン本文 */
.lesson{display:flex;flex-direction:column;gap:14px}
.lesson>h3{font-size:17px;margin:0}
.lesson>h4{font-size:15px;margin-top:4px}
.lesson p{margin:0}
.lesson .lead{font-size:16px}
.lesson ol.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;counter-reset:f}
.lesson ol.flow li{counter-increment:f;background:var(--surface2);border-radius:10px;padding:6px 12px;font-size:14px}
.lesson ol.flow li::before{content:counter(f);font-family:var(--display);font-weight:900;margin-right:6px;color:var(--dr)}
.formula{background:var(--sun-bg);border-radius:10px;padding:10px 14px;font-family:var(--display);font-weight:700}
.note{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.note b{font-family:var(--display)}
.note.tip{background:var(--sun-bg)} .note.trap{background:var(--ng-bg)} .note.memo{background:var(--surface2)}
.tw,.jw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.t th,.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;font-size:14px;vertical-align:top}
.t th{font-family:var(--display);font-size:12px;color:var(--muted);white-space:nowrap}
.j{font-size:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;border-collapse:separate;border-spacing:0;background:var(--surface);table-layout:fixed;min-width:300px}
.j th:nth-child(odd){width:29%}.j th:nth-child(even){width:21%}.j td.dr,.j td.cr{overflow-wrap:anywhere}
.j th{font-family:var(--display);font-size:12px;padding:4px 8px;text-align:left;color:var(--muted);background:var(--surface2)}
.j th.dr{color:var(--dr)} .j th.cr{color:var(--cr)}
.j td{padding:6px 8px;border-top:1px solid var(--line)}
.j td.dr{color:var(--dr);font-weight:700;border-left:4px solid var(--dr)} .j td.cr{color:var(--cr);font-weight:700;border-left:4px solid var(--cr)}
.j td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cap{font-size:12px;color:var(--muted);margin-top:4px !important}
.chip{display:inline-block;border-radius:6px;padding:0 8px;font-family:var(--display);font-weight:700;font-size:12px;line-height:22px;white-space:nowrap;border:1.5px solid transparent}
.chip.a{background:var(--dr);color:var(--on-solid)} .chip.x{background:var(--dr-bg);color:var(--dr);border-color:var(--dr)}
.chip.l,.chip.e{background:var(--cr);color:var(--on-solid)} .chip.r{background:var(--cr-bg);color:var(--cr);border-color:var(--cr)}
.fs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fsb{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.fsb h4{font-size:15px}.fsb .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:4px;min-height:150px}
.bs .col{display:grid;gap:4px}
.box{border-radius:8px;padding:8px 10px;font-family:var(--display);font-weight:900;display:flex;flex-direction:column;justify-content:center;border:1.5px solid transparent}
.box small{font-family:var(--body);font-weight:400;font-size:11px;opacity:.9}
.box.a{background:var(--dr);color:var(--on-solid)} .box.x{background:var(--dr-bg);color:var(--dr);border-color:var(--dr)}
.box.l,.box.e{background:var(--cr);color:var(--on-solid)} .box.r{background:var(--cr-bg);color:var(--cr);border-color:var(--cr)}
.box.p{background:var(--sun);color:var(--sun-ink)}
.home{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hs{border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hs b{width:100%;font-family:var(--display)}
.hs.dr{background:var(--dr-bg);color:var(--dr)} .hs.cr{background:var(--cr-bg);color:var(--cr)}
.kubun{font-size:12px;color:var(--muted)}
/* v2：文字を減らして見てわかるレッスン */
.key{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.5;text-wrap:balance;margin:0}
.key b{font-weight:900;background:linear-gradient(transparent 62%,var(--sun) 62%)}
.one{font-family:var(--display);font-weight:500;font-size:15px}
.one b{font-weight:900}
.lesson{gap:12px}
.vg{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.vc{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1.5px solid var(--line);background:var(--surface);border-left-width:6px}
.vc b{font-family:var(--display);font-weight:900;font-size:17px;line-height:1.25}
.vc small{font-size:12.5px;color:var(--muted);line-height:1.4}
.vc.a,.vc.x{border-left-color:var(--dr)} .vc.l,.vc.e,.vc.r{border-left-color:var(--cr)} .vc.c{border-left-color:var(--muted)}
.chip.c{background:var(--surface2);color:var(--ink);border-color:var(--line)}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.vsc{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.vsc b{font-family:var(--display);font-weight:700;font-size:13px}
.vsc span{font-family:var(--display);font-weight:900;font-size:16px;line-height:1.35}
.vsc.dr{background:var(--dr-bg);color:var(--dr)} .vsc.cr{background:var(--cr-bg);color:var(--cr)} .vsc.sun{background:var(--sun-bg)} .vsc.ng{background:var(--ng-bg)}
.rw{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.rr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.rr:first-child{border-top:0}
.rr i{font-style:normal;color:var(--muted)}
.rr b{font-family:var(--display);font-weight:900}
.bx5{display:grid;gap:6px}
.b5{border-radius:12px;padding:8px 12px;display:grid;grid-template-columns:64px 1fr;gap:0 10px;align-items:center;border:1.5px solid transparent}
.b5 b{font-family:var(--display);font-weight:900;font-size:17px;grid-row:span 2}
.b5 span{font-family:var(--display);font-weight:700;font-size:14px}
.b5 small{font-size:12px;opacity:.9}
.b5.a{background:var(--dr);color:var(--on-solid)} .b5.x{background:var(--dr-bg);color:var(--dr);border-color:var(--dr)}
.b5.l,.b5.e{background:var(--cr);color:var(--on-solid)} .b5.r{background:var(--cr-bg);color:var(--cr);border-color:var(--cr)}
.k4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kc{border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.kc b{font-family:var(--display);font-weight:900;font-size:16px}
.kc span{font-size:12.5px;line-height:1.4}
.kc small{font-family:var(--display);font-weight:700;font-size:12px;background:var(--surface);color:var(--ink);border-radius:6px;padding:1px 6px}
.kc.a{background:var(--dr-bg);color:var(--dr)} .kc.l{background:var(--cr-bg);color:var(--cr)}
.dep{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.dep i{font-style:normal;text-align:center;font-size:11px;font-family:var(--display);font-weight:700;background:var(--dr-bg);color:var(--dr);border-radius:6px;padding:10px 0}
.gbox{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-family:var(--display);font-weight:900;font-size:14px;text-align:center}
.gbox .gl,.gbox .gr{display:grid;gap:4px}
.gbox div>div{border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;justify-content:center}
.gbox small{font-weight:500;font-size:11px}
.g1,.g4{background:var(--surface2)} .g1{min-height:44px} .g2{background:var(--dr-bg);color:var(--dr);min-height:96px}
.g3{background:var(--sun);color:var(--sun-ink);min-height:86px} .g4{min-height:54px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags b,.tags span{border-radius:99px;padding:3px 12px;font-family:var(--display);font-size:13px}
.tags b{background:var(--sun);color:var(--sun-ink);font-weight:900} .tags span{background:var(--surface2);font-weight:500}
.t.g22 th,.t.g22 td{text-align:center;vertical-align:middle} .t.g22 td{font-family:var(--display);font-weight:900;font-size:15px}
.note p{margin:0;font-size:14px;line-height:1.6} .note .src{font-size:11px;color:var(--muted)}
.tg{display:table;font-style:normal;font-family:var(--body);font-weight:700;font-size:10px;line-height:1.5;border-radius:4px;padding:0 5px;margin-top:2px;white-space:nowrap}
.tg.a,.tg.x{background:var(--dr-bg);color:var(--dr)} .tg.l,.tg.e,.tg.r{background:var(--cr-bg);color:var(--cr)} .tg.c,.tg.t{background:var(--surface2);color:var(--muted)}
.jw .cap{margin:0 0 4px !important;font-size:12.5px}
details.memo summary{font-size:14px} details.memo p{margin:8px 0 0;font-size:14px}
.hintb{margin-left:auto;min-height:36px;padding:4px 14px;font-size:14px;background:var(--sun-bg);border-color:transparent}
.why{font-size:14px;margin:0} .calc{font-size:14px;margin:0;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:8px;padding:6px 10px}
.plus{font-size:13.5px;margin:0;border-left:4px solid var(--sun);padding-left:8px}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(8,13,26,.55)}
.sheet-in{position:relative;background:var(--bg);color:var(--ink);width:100%;max-width:560px;max-height:84%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;font-size:16px}
.sheet-h button{border:0;background:var(--surface2);border-radius:99px;width:38px;height:38px;font-size:15px}
.sheet-b{overflow:auto;padding:14px 16px 22px;display:flex;flex-direction:column;gap:12px}
@media (min-width:720px){ .sheet{align-items:center} .sheet-in{border-radius:18px} }

/* 解く */
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qprog{flex:1;min-width:80px;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--sun)}
.qtext{font-size:16px;line-height:1.8}
.entry{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:619px){ .entry{grid-template-columns:1fr} }
.side{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.side.dr{background:var(--dr-bg)} .side.cr{background:var(--cr-bg)}
.side .sh{font-family:var(--display);font-weight:900;font-size:14px}
.side.dr .sh{color:var(--dr)} .side.cr .sh{color:var(--cr)}
.er{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:6px}
.er select,.er input{width:100%;min-width:0;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;font-size:15px}
.er input{text-align:right;font-variant-numeric:tabular-nums}
.gbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.gbtn{border:1.5px solid transparent;border-radius:12px;min-height:56px;font-family:var(--display);font-weight:900;font-size:16px}
.gbtn.a{background:var(--dr);color:var(--on-solid)} .gbtn.x{background:var(--dr-bg);color:var(--dr);border-color:var(--dr)}
.gbtn.l,.gbtn.e{background:var(--cr);color:var(--on-solid)} .gbtn.r{background:var(--cr-bg);color:var(--cr);border-color:var(--cr)}
.gbtn:disabled{opacity:.4}.gbtn.pick{opacity:1;outline:3px solid var(--ink);outline-offset:2px}
.acct{font-family:var(--display);font-weight:900;font-size:30px;text-align:center;padding:14px 0}
.msg{font-size:13px;color:var(--ng)}
.res{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.res.ok{background:var(--ok-bg)} .res.ng{background:var(--ng-bg)}
.res h3{font-size:18px} .res.ok h3{color:var(--ok)} .res.ng h3{color:var(--ng)}
.kata{font-family:var(--display);font-weight:700;background:var(--surface);border-radius:8px;padding:6px 10px;font-size:14px}
.causes{display:flex;gap:6px;flex-wrap:wrap}
.causes button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;min-height:34px}
.causes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.modes .card{display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.modes select{height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;width:100%}

/* 弱点 */
.cbar{display:grid;grid-template-columns:150px 1fr 32px;gap:8px;align-items:center;font-size:13px}
.cbar .trk{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.cbar .trk i{display:block;height:100%;background:var(--ng)}
.wk{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.wk .q{font-size:14px}
.locked .tabs,.locked .sync{display:none}
.field{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:15px}
.steps{margin:8px 0 12px;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:14px}
details summary{cursor:pointer;font-family:var(--display);font-weight:700}
.src{margin:8px 0 0;padding-left:18px;font-size:13px}
@media (prefers-reduced-motion:no-preference){ .bar i,.qprog i{transition:width .3s} }
</style>

<script>
(function(){
"use strict";
const RAW = JSON.parse(document.getElementById("data").textContent);
const KKEY = "boki2.key";
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode.apply(null, Array.from(u)));
async function decryptWith(rawKey){
  const k = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: b64d(RAW.enc.iv)}, k, b64d(RAW.enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function deriveKey(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt: b64d(RAW.enc.salt), iterations: RAW.enc.iter}, base, 256));
}
function lockScreen(){
  const v = document.getElementById("view");
  v.innerHTML = '<section class="card" style="display:flex;flex-direction:column;gap:12px;max-width:460px;margin:24px auto;width:100%"><h1 style="font-size:20px">🔒 合言葉を入れてね</h1><p class="small muted">この端末では最初の1回だけ。次からは自動で開くよ。</p>'
    + '<div class="row"><input id="pass" class="field" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx-xxxx" aria-label="合言葉"><button class="btn pri" id="unlock" type="button">ひらく</button></div><p class="msg" id="lock-msg" hidden></p></section>';
  const inp = document.getElementById("pass"), btn = document.getElementById("unlock"), msg = document.getElementById("lock-msg");
  const say = t => { msg.textContent = t; msg.hidden = false; };
  async function go(){
    const pass = inp.value.toLowerCase().replace(/[^a-z0-9]/g, "");
    if (!pass) return say("合言葉を入れてから押してね。");
    if (!(window.crypto && crypto.subtle)) return say("このページは https のアドレスで開いてね。");
    btn.disabled = true; btn.textContent = "確認中…"; msg.hidden = true;
    try {
      const key = await deriveKey(pass), data = await decryptWith(key);
      try { localStorage.setItem(KKEY, b64e(key)); } catch(e){}
      document.documentElement.classList.remove("locked"); start(data);
    } catch(e){ btn.disabled = false; btn.textContent = "ひらく"; say("合言葉が違うみたい。もう一度確認してね。"); }
  }
  btn.addEventListener("click", go);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}
async function boot(){
  if (!RAW.enc) return start(RAW);
  document.documentElement.classList.add("locked");
  let saved = null; try { saved = localStorage.getItem(KKEY); } catch(e){}
  if (saved && window.crypto && crypto.subtle){
    try { const data = await decryptWith(b64d(saved)); document.documentElement.classList.remove("locked"); return start(data); }
    catch(e){ try { localStorage.removeItem(KKEY); } catch(_){} }
  }
  lockScreen();
}
function start(D){
const LID = D.stages[0].lessons;
const PBY = {}, PID = {};
D.problems.forEach(p => { (PBY[p.l] = PBY[p.l] || []).push(p); PID[p.id] = p; });

const GCLS = {"資産":"a","負債":"l","純資産":"e","収益":"r","費用":"x"};

const view = document.getElementById("view");
const fmt = n => Number(n).toLocaleString("ja-JP");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = x => Math.round(x * 100);

/* ───── 日付 ───── */
function dayNo(d){ return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
function today(){ return dayNo(new Date()); }
function keyOf(n){ return new Date(n * 864e5).toISOString().slice(0,10); }
function parseDay(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? Math.floor(Date.UTC(+m[1], +m[2]-1, +m[3]) / 864e5) : null; }
function md(n){ const d = new Date(n * 864e5); return (d.getUTCMonth()+1) + "/" + d.getUTCDate(); }

/* ───── 状態 ───── */
function blank(){ return {v:1, rs:0, cards:{}, les:{}, days:{}, goal:"2027-02-11", gt:0}; }
function norm(o){ const b = blank(); if (!o || typeof o !== "object") return b;
  return {v:1, rs:+o.rs||0, cards:(o.cards && typeof o.cards==="object") ? o.cards : {}, les:(o.les && typeof o.les==="object") ? o.les : {},
          days:(o.days && typeof o.days==="object") ? o.days : {}, goal:(typeof o.goal==="string" && parseDay(o.goal)!==null) ? o.goal : b.goal, gt:+o.gt||0}; }
function loadLocal(){ try { const r = localStorage.getItem(KEY); if (r) return norm(JSON.parse(r)); } catch(e){} return blank(); }
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function canon(o){ if (o === null || typeof o !== "object") return o; if (Array.isArray(o)) return o.map(canon);
  const r = {}; Object.keys(o).sort().forEach(k => r[k] = canon(o[k])); return r; }
function same(a,b){ return JSON.stringify(canon(a)) === JSON.stringify(canon(b)); }
function merge(a,b){
  a = norm(a); b = norm(b);
  if (a.rs !== b.rs) return a.rs > b.rs ? a : b;           // リセットは新しい方を採用
  const o = blank(); o.rs = a.rs;
  new Set([...Object.keys(a.cards), ...Object.keys(b.cards)]).forEach(id => {
    const x = a.cards[id], y = b.cards[id]; o.cards[id] = (!y || (x && (x.t||0) >= (y.t||0))) ? x : y; });
  new Set([...Object.keys(a.les), ...Object.keys(b.les)]).forEach(id => { o.les[id] = Math.max(a.les[id]||0, b.les[id]||0); });
  new Set([...Object.keys(a.days), ...Object.keys(b.days)]).forEach(k => { o.days[k] = Math.max(a.days[k]||0, b.days[k]||0); });
  if (a.gt >= b.gt){ o.goal = a.goal; o.gt = a.gt; } else { o.goal = b.goal; o.gt = b.gt; }
  return o;
}
let S = loadLocal();

/* ───── 端末間の同期(使えるときだけ) ───── */
let docRef = null, dirty = false, writing = false, wTimer = null, gotRemote = false;
function setSync(t){ document.getElementById("sync").textContent = t; }
function touch(){ saveLocal(); dirty = true; schedule(); gSchedule(); updateBadge(); }
function schedule(){ if (!docRef) return; clearTimeout(wTimer); wTimer = setTimeout(flush, 1500); }
async function flush(){
  if (!docRef || writing || !dirty) return;
  writing = true; dirty = false;
  try { await docRef.set(JSON.parse(JSON.stringify(S))); setSync("☁️ 端末間で同期済み"); }
  catch(e){ dirty = true; setSync("📱 この端末に保存(同期は次の操作で再試行)"); writing = false; return; }
  writing = false; if (dirty) schedule();
}
async function initSync(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    docRef = db.doc("data/users/" + uid + "/progress");
    setSync("☁️ 同期を確認中…");
    const timer = setTimeout(() => { if (!gotRemote) setSync("📱 この端末に保存(同期先に届いていません)"); }, 10000);
    docRef.onSnapshot(snap => {
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (!snap.metadata || !snap.metadata.fromCache){ gotRemote = true; clearTimeout(timer); }
      const remote = snap.exists ? norm(snap.data()) : null;
      const merged = remote ? merge(S, remote) : S;
      const localChanged = !same(merged, S);
      const needPush = !remote || !same(merged, remote);
      if (localChanged){ S = merged; saveLocal(); updateBadge(); if (!(route() === "drill" && sess)) render(); }
      if (needPush && gotRemote){ dirty = true; schedule(); } else if (gotRemote) setSync("☁️ 端末間で同期済み");
    }, () => { clearTimeout(timer); docRef = null; setSync("📱 この端末に保存"); });
  } catch(e){ docRef = null; }
}

/* ───── GitHub(Gist)での同期：Claudeの外(GitHub Pagesなど)で開いたとき用 ───── */
const IS_ART = !!(window.claude && window.claude.use);
const GKEY = "boki2.gist", GFILE = "boki2-progress.json", GAPI = "https://api.github.com";
let gcfg = null, gBusy = false, gPending = false, gTimer = null, gLast = 0, gErr = "";
function gLoad(){ try { const o = JSON.parse(localStorage.getItem(GKEY) || "null"); if (o && o.token && o.id) return o; } catch(e){} return null; }
function gStore(){ try { if (gcfg && gcfg.id) localStorage.setItem(GKEY, JSON.stringify(gcfg)); else localStorage.removeItem(GKEY); } catch(e){} }
async function gh(path, opt){
  opt = opt || {};
  const headers = {"Accept":"application/vnd.github+json", "Authorization":"Bearer " + gcfg.token};
  if (opt.body) headers["Content-Type"] = "application/json";
  const r = await fetch(GAPI + path, {method: opt.method || "GET", headers, body: opt.body, cache: "no-store"});
  if (!r.ok){ const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function gPull(){
  const g = await gh("/gists/" + gcfg.id), f = g.files && g.files[GFILE];
  if (!f) return null;
  let txt = f.content;
  if (f.truncated && f.raw_url) txt = await (await fetch(f.raw_url, {cache:"no-store"})).text();
  try { return norm(JSON.parse(txt)); } catch(e){ return null; }
}
function gBody(){ const files = {}; files[GFILE] = {content: JSON.stringify(S)}; return files; }
async function gSync(){
  if (!gcfg || !gcfg.id) return;
  if (gBusy){ gPending = true; return; }
  gBusy = true; setSync("☁️ 同期中…");
  try {
    const remote = await gPull(), merged = remote ? merge(S, remote) : S;
    if (!same(merged, S)){ S = merged; saveLocal(); updateBadge(); if (!(route() === "drill" && sess)) render(); }
    if (!remote || !same(S, remote)) await gh("/gists/" + gcfg.id, {method:"PATCH", body: JSON.stringify({files: gBody()})});
    gLast = Date.now(); gErr = ""; setSync("☁️ GitHubで同期済み");
  } catch(e){
    gErr = e.status === 401 ? "トークンが無効になっているよ。作り直して接続し直してね。" : e.status === 404 ? "同期先が見つからないよ。接続し直してね。" : "いまは通信できなかったよ。記録はこの端末に残っていて、次の操作でもう一度送るね。";
    setSync("📱 この端末に保存(同期は保留中)");
  }
  gBusy = false;
  if (gPending){ gPending = false; gSchedule(); }
}
function gSchedule(){ if (!gcfg || !gcfg.id) return; clearTimeout(gTimer); gTimer = setTimeout(gSync, 3000); }
async function gConnect(token){
  gcfg = {token: token, id: ""};
  try {
    const list = await gh("/gists?per_page=100");
    let hit = (Array.isArray(list) ? list : []).find(g => g.files && g.files[GFILE]);
    if (!hit) hit = await gh("/gists", {method:"POST", body: JSON.stringify({description:"簿記2級 最短ルート 学習記録", public:false, files: gBody()})});
    gcfg.id = hit.id; gStore(); await gSync(); return "";
  } catch(e){
    gcfg = null; gStore();
    return e.status === 401 ? "トークンが違うみたい。もう一度コピーして貼ってね。" : (e.status === 403 || e.status === 404) ? "このトークンにはgistの権限が付いていないみたい。「gist」にチェックを入れて作り直してね。" : "通信できなかったよ。電波を確認してもう一度試してね。";
  }
}
function gCard(){
  if (IS_ART) return "";
  let h = '<section class="card"><h2 class="sec-t">☁️ スマホとPCで記録を共有</h2>';
  if (gcfg && gcfg.id){
    const t = gLast ? new Date(gLast) : null;
    h += '<p style="margin:8px 0">✅ GitHubに接続済み'+(t ? '<span class="small muted num">　最終同期 '+String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0")+'</span>' : "")+'</p>'
      + (gErr ? '<p class="msg">'+esc(gErr)+'</p>' : "")
      + '<div class="row"><button class="btn" data-act="gist-sync">今すぐ同期</button><button class="btn" data-act="gist-off">この端末の接続を解除</button></div>';
  } else {
    h += '<p class="small muted" style="margin-top:6px">GitHubのトークンを1回貼ると、どの端末でも同じ記録になるよ。貼らなくても、この端末だけで普通に使える。</p>'
      + '<ol class="steps"><li><a href="https://github.com/settings/tokens/new?scopes=gist&description=boki2-sync" target="_blank" rel="noopener">GitHubでトークンを作るページを開く</a>(「gist」だけにチェックが入った状態で開くよ)</li><li>一番下の緑のボタン「Generate token」を押して、出てきた ghp_ から始まる文字をコピー</li><li>下の欄に貼って「接続する」</li></ol>'
      + '<div class="row"><input type="password" id="gh-token" class="field" placeholder="ghp_..." autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="GitHubトークン"><button class="btn pri" data-act="gist-connect">接続する</button></div><p class="msg" id="gist-msg" hidden></p>';
  }
  return h + "</section>";
}

/* ───── 集計 ───── */
function lstat(lid){ const ps = PBY[lid] || []; let seen=0, m=0, ok=0, ng=0;
  ps.forEach(p => { const c = S.cards[p.id]; if (c){ seen++; m += Math.min(c.b,3)/3; ok += c.ok||0; ng += c.ng||0; } });
  return {n:ps.length, seen, mast: ps.length ? m/ps.length : 0, ok, ng}; }
function stage0(){ let n=0, m=0; LID.forEach(l => { const s = lstat(l); n += s.n; m += s.mast * s.n; }); return n ? m/n : 0; }
function dueIds(){ const t = today(); return D.problems.filter(p => { const c = S.cards[p.id]; return c && c.d <= t; })
  .sort((a,b) => (S.cards[a.id].d - S.cards[b.id].d) || (S.cards[a.id].b - S.cards[b.id].b)).map(p => p.id); }
function nextLesson(){ return LID.find(l => !S.les[l]); }
function newIds(limit){ const read = LID.filter(l => S.les[l]); const src = read.length ? read : [LID[0]];
  return src.flatMap(l => PBY[l] || []).filter(p => !S.cards[p.id]).slice(0, limit).map(p => p.id); }
function weakIds(){ return D.problems.filter(p => { const c = S.cards[p.id]; return c && (c.ng||0) > 0 && c.b < 2; })
  .sort((a,b) => (S.cards[b.id].ng - S.cards[a.id].ng)).map(p => p.id); }
function streak(){ let t = today(), n = 0; if (!S.days[keyOf(t)]) t--; while (S.days[keyOf(t)]){ n++; t--; } return n; }
function updateBadge(){ const b = document.getElementById("due-badge"), n = dueIds().length; b.hidden = !n; b.textContent = n; }

/* ───── 記録(間隔反復) ───── */
function record(pid, ok, hinted){
  const t = today(), c = Object.assign({b:0, d:t, ok:0, ng:0}, S.cards[pid] || {});
  if (ok && hinted){ c.b = 1; c.ok++; c.d = t + INT[1]; }
  else if (ok){ c.b = Math.min(INT.length-1, c.b+1); c.ok++; c.d = t + INT[c.b]; }
  else { c.b = 0; c.ng++; c.d = t; }
  c.t = Date.now(); S.cards[pid] = c;
  const k = keyOf(t); S.days[k] = (S.days[k]||0) + 1;
  touch();
}

function jTable(dr, cr){ const n = Math.max(dr.length, cr.length); let h = '<div class="jw"><table class="j"><thead><tr><th class="dr">借方</th><th>金額</th><th class="cr">貸方</th><th>金額</th></tr></thead><tbody>';

let sess = null;

    const opts = '<option value="">科目を選ぶ</option>'+p.ch.map(a => '<option>'+esc(a)+'</option>').join("");
    const side = (k, name) => '<div class="side '+k+'"><div class="sh">'+name+'</div>'+Array.from({length:ROWS}, (_,r) =>
      '<div class="er"><select id="'+k+"-a-"+r+'" aria-label="'+name+"科目"+(r+1)+'">'+opts+'</select><input id="'+k+"-n-"+r+'" type="text" inputmode="numeric" autocomplete="off" placeholder="金額" aria-label="'+name+"金額"+(r+1)+'"></div>').join("")+'</div>';
    h += '<p class="qtext">'+esc(p.q)+'</p><div class="entry">'+side("dr","借方")+side("cr","貸方")+'</div><p class="msg" id="msg" hidden></p>'
      + '<div class="row" id="acts"><button class="btn pri" data-act="grade" style="flex:1">答え合わせ</button><button class="btn" data-act="giveup">わからない</button></div>';
  }
  h += '<div id="res"></div></section>';
  view.innerHTML = h; window.scrollTo(0,0);
}
function readSide(k){ const rows = [];
  for (let r=0;r<ROWS;r++){ const a = document.getElementById(k+"-a-"+r).value, n = document.getElementById(k+"-n-"+r).value.replace(/[^\d]/g,"");
    if (a || n) rows.push([a, n === "" ? null : Number(n)]); }
  return rows; }
function keyRows(rows){ return rows.map(r => r[0]+"|"+r[1]).sort().join(";"); }
function judge(p, dr, cr){ return keyRows(dr) === keyRows(p.dr) && keyRows(cr) === keyRows(p.cr); }
function grade(giveup){
  const p = PID[sess.ids[sess.i]], msg = document.getElementById("msg");
  const dr = readSide("dr"), cr = readSide("cr");
  let note = "";
  if (!giveup){
    if (!dr.length && !cr.length){ msg.textContent = "1行以上入力してね。わからないときは「わからない」でOK。"; msg.hidden = false; return; }
    if ([...dr, ...cr].some(r => !r[0] || r[1] === null)){ msg.textContent = "科目と金額がそろっていない行があるよ。"; msg.hidden = false; return; }
    const dup = rows => new Set(rows.map(r => r[0])).size !== rows.length;
    if (dup(dr) || dup(cr)) note = "同じ科目が同じ側に2回入っているよ。本番では不正解になるので、1行にまとめよう。";
  }
  msg.hidden = true;
  finish(p, !giveup && judge(p, dr, cr), note);
  view.querySelectorAll(".er select, .er input").forEach(el => el.disabled = true);
  document.getElementById("acts").hidden = true;
}
function gradeCls(g, btn){
  const p = PID[sess.ids[sess.i]];
  view.querySelectorAll(".gbtn").forEach(b => { b.disabled = true; if (b === btn) b.classList.add("pick"); });
  finish(p, g === p.ans, "");
}
function finish(p, ok, note){
  const firstTry = !(p.id in sess.first), hinted = !!sess.hint[p.id];
  sess.answered = true;
  if (firstTry){ sess.first[p.id] = ok; record(p.id, ok, hinted); if (!ok){ sess.ids.push(p.id); } }
  else if (ok){ const c = S.cards[p.id]; if (c){ c.d = today() + 1; c.t = Date.now(); touch(); } }
  else if (!sess.again[p.id]){ sess.again[p.id] = 1; }
  let h = '<div class="res '+(ok?"ok":"ng")+'" role="status"><h3>'+(ok?"⭕ 正解！":"❌ おしい…")+'</h3>';
  if (note) h += '<p class="small">'+esc(note)+'</p>';
  if (p.t === "cls") h += '<p style="margin:0"><b>'+esc(p.q)+'</b> は <span class="chip '+GCLS[p.ans]+'">'+p.ans+'</span>　'+esc(p.exp)+'</p>';
  else h += jTable(p.dr, p.cr)+'<div class="kata">🧩 '+esc(p.kata)+'</div>'
    + (p.why ? '<p class="why">'+esc(p.why)+'</p>' : "") + (p.calc ? '<p class="calc">🧮 '+esc(p.calc)+'</p>' : "") + (p.plus ? '<p class="plus">➕ '+esc(p.plus)+'</p>' : "");
  if (ok && hinted && firstTry) h += '<p class="small muted" style="margin:0">ヒントを見て正解 → 明日もう一度出すね</p>';
  if (!ok && firstTry) h += '<div><p class="small muted" style="margin:0 0 4px">間違えた原因は？</p><div class="causes">'+CAUSES.map(c => '<button type="button" data-act="cause" data-c="'+c[0]+'" data-p="'+p.id+'" aria-pressed="false">'+c[1]+'</button>').join("")+'</div></div>';
  h += '<button class="btn pri wide" data-act="next" id="next">次の問題へ</button></div>';
  document.getElementById("res").innerHTML = h;
  const nx = document.getElementById("next"); nx.focus({preventScroll:true}); nx.scrollIntoView({block:"nearest"});
}
function renderSummary(){
  const ids = Object.keys(sess.first), right = ids.filter(id => sess.first[id]).length, miss = ids.filter(id => !sess.first[id]);
  let h = '<section class="card" style="display:flex;flex-direction:column;gap:12px"><h1 style="font-size:22px">'+(miss.length ? "おつかれさま💪" : "全問正解🎉")+'</h1><p class="disp" style="font-size:30px;font-weight:900"><span class="num">'+right+" / "+ids.length+'</span> <small style="font-size:14px">問 正解(1回目)</small></p>';
  if (miss.length){ h += '<p class="small muted">間違えた問題は今日の復習に入れておいたよ。型だけ見直しておこう。</p>';
    miss.forEach(id => { const p = PID[id]; h += '<div class="wk"><div class="q">'+esc(p.q)+'</div>'+(p.t==="cls" ? '<div><span class="chip '+GCLS[p.ans]+'">'+p.ans+'</span></div>' : '<div class="kata">🧩 '+esc(p.kata)+'</div>')+'</div>'; }); }
  h += '<div class="row"><a class="btn pri" href="#home" data-act="endhome">ホームへ</a><button class="btn" data-act="menu">ほかの問題を解く</button></div></section>';
  view.innerHTML = h; window.scrollTo(0,0);
}
function renderDrillMenu(){
  const due = dueIds(), fresh = newIds(10), weak = weakIds();
  const opts = LID.map(l => '<option value="'+l+'">'+esc(D.lessons[l].title)+"("+(PBY[l]||[]).length+"問)</option>").join("");
  view.innerHTML = '<section><h1 style="font-size:22px">どれを解く？</h1></section><section class="modes">'
    + '<div class="card"><h3>🔁 今日の復習</h3><p class="small muted">期限が来た問題 <b class="num">'+due.length+'</b>問</p><button class="btn sun" data-act="review"'+(due.length?"":" disabled")+'>はじめる</button></div>'
    + '<div class="card"><h3>✏️ 新しい問題</h3><p class="small muted">読んだレッスンの未着手 <b class="num">'+fresh.length+'</b>問(最大10問ずつ)</p><button class="btn" data-act="fresh"'+(fresh.length?"":" disabled")+'>はじめる</button></div>'
    + '<div class="card"><h3>🎯 苦手だけ</h3><p class="small muted">間違えたまま定着していない <b class="num">'+weak.length+'</b>問</p><button class="btn" data-act="weak"'+(weak.length?"":" disabled")+'>はじめる</button></div>'
    + '<div class="card"><h3>📖 レッスンを選ぶ</h3><select id="pick" aria-label="レッスンを選ぶ">'+opts+'</select><button class="btn" data-act="pick">はじめる</button></div>'
    + '<div class="card"><h3>🎲 仕訳ランダム10問</h3><p class="small muted">本番の第1問のつもりで、論点まぜこぜ</p><button class="btn" data-act="random">はじめる</button></div></section>';
}

/* ───── 弱点 ───── */
function renderWeak(){
  const cards = Object.keys(S.cards).filter(id => PID[id]);
  if (!cards.length){ view.innerHTML = '<section class="card"><h1 style="font-size:20px">まだ記録がないよ</h1><p class="muted">問題を解くと、ここに「どこで・なぜ間違えたか」が貯まっていくよ。</p><p style="margin-top:10px"><a class="btn pri" href="#drill">問題を解く</a></p></section>'; return; }
  const cc = {}; let cmax = 0; cards.forEach(id => { const c = S.cards[id].c; if (c){ cc[c] = (cc[c]||0)+1; cmax = Math.max(cmax, cc[c]); } });
  let h = '<section class="card"><h2 class="sec-t">間違いの原因 <small>答え合わせのあとに選んだ内訳</small></h2><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">';
  h += cmax ? CAUSES.map(c => '<div class="cbar"><span>'+c[1]+'</span><div class="trk"><i style="width:'+pct((cc[c[0]]||0)/cmax)+'%"></i></div><span class="num">'+(cc[c[0]]||0)+'</span></div>').join("") : '<p class="small muted">まだ原因の記録はないよ。</p>';
  h += '</div></section><section class="card"><h2 class="sec-t">レッスン別</h2><div class="tw"><table class="t"><thead><tr><th>レッスン</th><th>着手</th><th>正答率</th><th>定着</th></tr></thead><tbody>';
  LID.forEach(l => { const s = lstat(l); if (!s.seen) return; const tot = s.ok + s.ng;
    h += '<tr><td>'+esc(D.lessons[l].title)+'</td><td class="num">'+s.seen+"/"+s.n+'</td><td class="num">'+(tot ? pct(s.ok/tot)+"%" : "–")+'</td><td class="num">'+pct(s.mast)+'%</td></tr>'; });
  h += '</tbody></table></div></section>';
  const weak = weakIds();
  h += '<section class="card"><h2 class="sec-t">苦手リスト <small>'+weak.length+'問</small></h2>';
  if (!weak.length) h += '<p class="small muted" style="margin-top:8px">いまは苦手なし✨</p>';
  else { h += '<p style="margin:8px 0"><button class="btn sun" data-act="weak">苦手をまとめて解く</button></p>';
    weak.slice(0,30).forEach(id => { const p = PID[id], c = S.cards[id]; h += '<div class="wk"><div class="q">'+esc(p.q)+'</div><div class="small muted"><span class="num">ミス'+c.ng+'回</span> ・ '+esc(D.lessons[p.l].title)+'</div>'+(p.t==="cls" ? "" : '<div class="kata">🧩 '+esc(p.kata)+'</div>')+'</div>'; }); }
  view.innerHTML = h + "</section>";
}

/* ───── ルーティング ───── */
function route(){ const r = (location.hash || "#home").slice(1); return r.indexOf("lesson-") === 0 ? "lesson" : (["home","learn","drill","weak"].includes(r) ? r : "home"); }
function render(){
  const r = route(), tab = r === "lesson" ? "learn" : r;
  document.querySelectorAll("#tabs button").forEach(b => { if (b.dataset.go === tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if (r === "home") renderHome(); else if (r === "learn") renderLearn(); else if (r === "lesson") renderLesson(location.hash.slice(8)); else if (r === "drill") renderDrill(); else renderWeak();
  updateBadge();
}
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-go]"); if (!b) return;
  if (b.dataset.go === "drill" && route() === "drill" && sess && sess.i >= sess.ids.length) sess = null;
  if (location.hash === "#"+b.dataset.go) render(); else location.hash = "#"+b.dataset.go; });
window.addEventListener("hashchange", render);
let resetArmed = false;
view.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return; const a = b.dataset.act;
  if (a === "review") startSession(dueIds().slice(0,30), "今日の復習");
  else if (a === "fresh") startSession(newIds(10), "新しい問題");
  else if (a === "weak") startSession(weakIds().slice(0,20), "苦手だけ");
  else if (a === "pick") startSession((PBY[document.getElementById("pick").value]||[]).map(p => p.id), "レッスン別");
  else if (a === "random") startSession(shuffle(D.problems.filter(p => p.t !== "cls").map(p => p.id)).slice(0,10), "仕訳ランダム");
  else if (a === "done"){ const l = b.dataset.l; if (!S.les[l]){ S.les[l] = Date.now(); touch(); } startSession((PBY[l]||[]).map(p => p.id), D.lessons[l].title); }
  else if (a === "hint"){ const p = PID[sess.ids[sess.i]], x = secOf(p.l, p.s); if (!sess.answered) sess.hint[p.id] = 1; openSheet(x.t, x.html); }
  else if (a === "grade") grade(false);
  else if (a === "giveup") grade(true);
  else if (a === "cls") gradeCls(b.dataset.g, b);
  else if (a === "next"){ sess.i++; render(); }
  else if (a === "quit" || a === "menu"){ sess = null; render(); }
  else if (a === "endhome"){ sess = null; }
  else if (a === "cause"){ const c = S.cards[b.dataset.p]; if (c){ c.c = b.dataset.c; c.t = Date.now(); touch(); }
    b.parentNode.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false")); }
  else if (a === "gist-connect"){ const inp = document.getElementById("gh-token"), m = document.getElementById("gist-msg"), tk = inp.value.trim();
    if (!tk){ m.textContent = "トークンを貼ってから押してね。"; m.hidden = false; return; }
    b.disabled = true; b.textContent = "接続中…";
    gConnect(tk).then(err => { if (err){ b.disabled = false; b.textContent = "接続する"; m.textContent = err; m.hidden = false; } else if (route() === "home") render(); }); }
  else if (a === "gist-sync"){ gSync().then(() => { if (route() === "home") render(); }); }
  else if (a === "gist-off"){ gcfg = null; gStore(); gErr = ""; setSync("📱 この端末に保存"); render(); }
  else if (a === "relock"){ try { localStorage.removeItem(KKEY); } catch(e){} location.reload(); }
  else if (a === "reset"){ const m = document.getElementById("reset-msg");
    if (!resetArmed){ resetArmed = true; b.textContent = "本当に消す(もう一度押す)"; m.textContent = "すべての端末の記録が消えるよ"; setTimeout(() => { resetArmed = false; if (b.isConnected){ b.textContent = "学習記録をリセット"; m.textContent = ""; } }, 5000); }
    else { resetArmed = false; const goal = S.goal; S = blank(); S.rs = Date.now(); S.goal = goal; S.gt = Date.now(); sess = null; touch(); render(); } }
});
view.addEventListener("input", e => { const el = e.target;
  if (el.matches(".er input")){ const v = el.value.replace(/[^\d]/g,"").slice(0,12); el.value = v ? fmt(v) : ""; } });
view.addEventListener("change", e => { const el = e.target;
  if (el.id === "goal" && parseDay(el.value) !== null){ S.goal = el.value; S.gt = Date.now(); touch(); render(); } });
view.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".er input")){ e.preventDefault(); const g = view.querySelector('[data-act="grade"]'); if (g && !document.getElementById("acts").hidden) grade(false); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "visible") return; if (!(route() === "drill" && sess)) render(); gSync(); });

window.__boki = {judge, merge, norm, blank, PID};   // 検証用
render();
initSync();
if (!IS_ART){ gcfg = gLoad(); if (gcfg) gSync(); }
}
boot();
})();
</script>
